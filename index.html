*{box-sizing:border-box;font-family:"IBM Plex Sans Arabic",Arial,sans-serif}html,body{font-family:"IBM Plex Sans Arabic",Arial,sans-serif}body{margin:0;background:linear-gradient(180deg,#f1f3f6,#f8fafc);color:var(--ink);font-family:"IBM Plex Sans Arabic",Arial,sans-serif!important;font-size:16px}button,input,select,textarea{font:inherit;font-family:"IBM Plex Sans Arabic",Arial,sans-serif!important}button{cursor:pointer;border:0}.app{width:min(100%,820px);margin:auto;padding:14px}.top{position:relative;background:linear-gradient(135deg,#69239b,#8e3dbd);color:#fff;border-radius:18px;padding:19px 56px 18px 18px;box-shadow:0 10px 28px #7026a633}.top h1{margin:0;font-size:25px;font-weight:700;display:flex;align-items:baseline;gap:7px}.version{font-size:11px;font-weight:400;opacity:.78;direction:ltr;letter-spacing:.2px}.top p{margin:6px 0 0;font-size:13px;line-height:1.8;font-weight:400;opacity:.96}.gear{position:absolute;right:13px;top:13px;width:39px;height:39px;border-radius:12px;background:#ffffff26;color:#fff;font-size:23px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:17px;margin:12px 0;padding:12px;box-shadow:0 5px 19px #1f29370d}.actions{display:flex;gap:8px;flex-wrap:wrap}.settings-actions{display:grid;gap:8px;margin-top:10px}.settings-actions .btn{width:100%;margin-top:0!important}.btn{border-radius:10px;padding:9px 14px;font-weight:700;color:#fff;min-height:42px;box-shadow:0 2px 5px #0f172a12}.btn.purple{background:var(--purple)}.btn.green{background:var(--teal)}.btn.blue{background:var(--blue)}.btn.gray{background:#64748b}.btn.red{background:#b4232d}.btn.gold{background:var(--gold)}.btn:active{transform:scale(.98)}.file{display:none}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.filters label{font-size:12px;font-weight:700;color:var(--muted)}select{width:100%;margin-top:4px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:600;color:var(--ink)}.state{text-align:center;color:var(--muted);font-size:13px;font-weight:600;line-height:1.8;padding:7px}.cards{display:grid;gap:9px}.student{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:0 3px 13px #0f172a0b;transition:.15s}.student.has-v{border-color:#ef9a9a;background:#fff8f8}.student.progress-done{border-color:#7bc9a9;background:#f0fdf7}.compact-student{padding:9px 12px}.compact-student .student-head{justify-content:flex-start}.compact-status{font-size:20px;font-weight:700;width:27px;text-align:center}.compact-status.done{color:#16855e}.compact-status.pending{color:#b4232d}.student.progress-pending{border-color:#efb0b0;background:#fff8f8}.progress-status{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}.progress-status.done{color:#166534;background:#dcfce7}.progress-status.pending{color:#991b1b;background:#fee2e2}.student-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.student-name{font-size:19px;font-weight:700;line-height:1.5}.student-meta{font-size:12px;color:var(--muted);font-weight:600}.vcount{font-size:12px;font-weight:700;color:var(--red);background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:3px 7px;white-space:nowrap}.score-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.score{background:#fff;border:2px solid #cbd5e1;border-radius:8px;padding:4px 2px;font-size:13px;font-weight:700;min-height:0;height:auto;line-height:1.25;white-space:nowrap}.score.active{color:#fff}.score.good{border-color:#16855e}.score.good.active{background:#16855e}.score.partial{border-color:#2788d8}.score.partial.active{background:#2788d8}.score.support{border-color:#d08a22}.score.support.active{background:#d08a22}.score.none{border-color:#b45656}.score.none.active{background:#b45656}.hint{color:var(--muted);font-size:12px;font-weight:600;text-align:center;margin:8px 0 0}.unit-note{margin-top:9px;background:#f4f0ff;color:#6b21a8;border:1px solid #d8b4fe;border-radius:10px;padding:9px;text-align:center;font-size:12px;font-weight:600}.overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.overlay.open{display:flex}.modal{width:min(100%,760px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 20px 55px #0006}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px}.modal h2{font-size:21px;margin:0;color:var(--purple);font-weight:700}.close{background:#e2e8f0;color:#334155;width:36px;height:36px;border-radius:50%;font-size:25px;line-height:1}.vdate{margin:9px 0}.vdate input{width:150px!important;padding:5px!important;font-size:12px!important;height:31px}.history-table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:11px}.history-table th,.history-table td{border:1px solid #e2e8f0;padding:5px;text-align:right}.history-table th{background:#f1f5f9;color:#475569}.history-table td:first-child{width:105px;white-space:nowrap}.history-title{font-size:13px;font-weight:700;color:#7026a6;margin:8px 0 4px}.vlist{display:grid;gap:7px}.vitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid #d9dee6;border-radius:12px;background:#fafafa;font-weight:600}.vitem.checked{background:#ffe4e6;border-color:#ef9a9a;color:#a11b2a}.vitem input{width:23px;height:23px;accent-color:#dc2626}.lessons{display:grid;gap:8px}.lesson{border:1px solid var(--line);border-radius:12px;padding:9px}.lesson-title{font-weight:700;color:#92400e;margin-bottom:6px}.lesson .score-row{margin:0}.student-choice{padding:12px;border:1px solid var(--line);border-radius:11px;margin:7px 0;font-weight:700;color:var(--purple);background:#fff}.student-choice.done{border-color:#7bc9a9;background:#ecfdf5;color:#166534}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;text-align:center;color:var(--muted);padding:22px;font-weight:600}.footer{font-size:11px;color:#64748b;text-align:center;padding:14px;line-height:1.8}@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.score{font-size:11px;padding:8px 1px}.student-name{font-size:17px}.top h1{font-size:22px}}

<body>
<div class="app">
<header class="top"><button class="gear" id="settingsBtn" aria-label="الإعدادات">⚙️</button><h1>تحقق ومخالفات <small class="version">v.<span id="appVersion">35</span></small></h1></header>
<section class="toolbar">
 <div class="actions"><input class="file" id="fileInput" type="file" accept=".json,application/json"></div>
 <div class="filters"><label>الصف<select id="classSel"></select></label><label>الفصل<select id="sectionSel"></select></label><label>الوحدة<select id="unitSel"></select></label><label>الدرس<select id="lessonSel"></select></label></div>
 <div class="state" id="state">استورد ملف JSON للبدء.</div>
</section>
<main id="cards" class="cards"></main><div class="footer">الحفظ داخل IndexedDB في هذا المتصفح تلقائي. لا تُرسل البيانات إلى أي خادم. لاستخدامها في Google Sheets صدّر JSON ثم استورده من «برنامج تحقق ومخالفات» داخل بوابة الواجبات.</div>
</div>
<div class="overlay" id="modalOverlay"><div class="modal" id="modal"></div></div><div class="overlay" id="settingsOverlay"><div class="modal" id="settingsModal"></div></div>
<script>
(function(){
'use strict';
var APP_VERSION='35';
var KEY='tahaqquq_standalone_checks_v1', DB_NAME='tahaqquq_checks_db_v1', DB_STORE='app', DB_KEY='snapshot', SCORES=[['متقن',10,'good'],['فهم جزئي',7,'partial'],['يحتاج لدعم',4,'support'],['لم ينفذ',0,'none']];
var state={version:2,createdAt:new Date().toISOString(),classes:{},violationTypes:['تأخر','عدم إحضار الواجب','عدم تنفيذ النشاط','سلوك غير مناسب','نسيان الأدوات','أخرى']};
var queue={checks:[],violations:[],violationDeletes:[]};
var $=function(id){return document.getElementById(id)};
var dbPromise=null;
function openDB(){if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB غير متاح'));if(dbPromise)return dbPromise;dbPromise=new Promise(function(resolve,reject){var r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE);};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error||new Error('فشل فتح IndexedDB'));};});return dbPromise;}
function readDB(){return openDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(DB_KEY);r.onsuccess=function(){resolve(r.result||null)};r.onerror=function(){reject(r.error)};});});}
function writeDB(record){return openDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(record,DB_KEY);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error)};});});}
function load(){readDB().then(function(x){if(x&&x.state){state=x.state;queue=x.queue||queue;render();setState('تم تحميل البيانات من IndexedDB — آخر حفظ: '+(x.savedAt||'غير معروف'));return;}var legacy=null;try{legacy=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(legacy&&legacy.state){state=legacy.state;queue=legacy.queue||queue;return writeDB({version:APP_VERSION,state:state,queue:queue,savedAt:new Date().toISOString()}).then(function(){try{localStorage.removeItem(KEY)}catch(e){};render();setState('تم نقل البيانات القديمة بأمان إلى IndexedDB');});}render();}).catch(function(){var legacy=null;try{legacy=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(legacy&&legacy.state){state=legacy.state;queue=legacy.queue||queue;}render();setState('تعذر فتح IndexedDB؛ راجع إعدادات المتصفح');});}
function save(){var record={version:APP_VERSION,state:state,queue:queue,savedAt:new Date().toISOString()};writeDB(record).then(function(){setState('تم الحفظ محليًا في IndexedDB — '+new Date(record.savedAt).toLocaleTimeString('ar-EG'));}).catch(function(){setState('تعذر الحفظ في IndexedDB');});}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=Number(String(v==null?'':v).replace(/[،,]/g,'.'));return isFinite(n)?n:null}
function ckey(name,sec){return String(name||'').trim()+'|'+String(sec||'').trim()}
function vkey(cls,x){return [cls,x.name,x.section,x.date,x.type].map(function(v){return String(v||'').trim();}).join('\u0001')}
function qkey(x){return [x.className,x.name,x.section,x.lesson].map(function(v){return String(v||'').trim();}).join('\u0001')}
function today(){return new Date().toISOString().slice(0,10)}
function setState(t){$('state').textContent=t}
function classes(){return Object.keys(state.classes||{}).sort(function(a,b){return a.localeCompare(b,'ar');})}
function lessonsFor(cls,unit){var d=state.classes[cls]||{},a=(d.lessonsByUnit||{})[String(unit)]||[];return a.slice().sort(function(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true});})}
function ensureClass(cls){return state.classes[cls]||(state.classes[cls]={students:[],lessonsByUnit:{},checks:{},violations:[]})}
function currentFilters(){return {cls:$('classSel').value,sec:$('sectionSel').value,unit:$('unitSel').value,lesson:$('lessonSel').value}}
function render(){var fs=currentFilters(),cs=classes();$('classSel').innerHTML=cs.length?cs.map(function(x){return '<option>'+esc(x)+'</option>'}).join(''):'<option value="">لا توجد بيانات</option>';if(cs.indexOf(fs.cls)>=0)$('classSel').value=fs.cls;renderSections();}
function renderSections(){var cls=$('classSel').value,d=state.classes[cls]||{},old=$('sectionSel').value,secs={};(d.students||[]).forEach(function(x){secs[x.section||''] = 1});var arr=Object.keys(secs).sort(function(a,b){return a.localeCompare(b,'ar');});$('sectionSel').innerHTML=arr.map(function(x){return '<option value="'+esc(x)+'">'+esc(x||'كل الفصول')+'</option>'}).join('')||'<option value="">كل الفصول</option>';if(arr.indexOf(old)>=0)$('sectionSel').value=old;renderUnits();}
function renderUnits(){var cls=$('classSel').value,d=state.classes[cls]||{},units=Object.keys(d.lessonsByUnit||{}).sort(function(a,b){return Number(a)-Number(b)}),old=$('unitSel').value;$('unitSel').innerHTML='<option value="">اختر وحدة</option>'+units.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');if(units.indexOf(old)>=0)$('unitSel').value=old;renderLessons();}
function renderLessons(){var f=currentFilters(),ls=lessonsFor(f.cls,f.unit),old=$('lessonSel').value;$('lessonSel').innerHTML='<option value="">اختر درس</option>'+ls.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');if(ls.indexOf(old)>=0)$('lessonSel').value=old;renderCards();}
function studentList(f){var d=state.classes[f.cls]||{};return (d.students||[]).filter(function(x){return !f.sec||!x.section||x.section===f.sec;}).slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'ar',{numeric:true});});}
function scoreFor(f,p,lesson){var d=state.classes[f.cls]||{},m=d.checks||{},x=m[ckey(p.name,p.section)]||{};return Object.prototype.hasOwnProperty.call(x,lesson)?x[lesson]:undefined}
function violationCount(cls,p){var d=state.classes[cls]||{};return (d.violations||[]).filter(function(x){return x.name===p.name&&x.section===p.section;}).length}
function scoreButtons(f,p,lesson){var old=scoreFor(f,p,lesson);return '<div class="score-row">'+SCORES.map(function(a){return '<button class="score '+a[2]+(old!==undefined&&Number(old)===a[1]?' active':'')+'" data-score="'+a[1]+'" data-name="'+esc(p.name)+'" data-sec="'+esc(p.section)+'" data-lesson="'+esc(lesson)+'">'+a[0]+'</button>'}).join('')+'</div>'}
function allLessonsForClass(cls){var d=state.classes[cls]||{},out=[];Object.keys(d.lessonsByUnit||{}).forEach(function(u){(d.lessonsByUnit[u]||[]).forEach(function(l){if(out.indexOf(l)<0)out.push(l);});});return out;}
function renderCards(){var f=currentFilters(),box=$('cards');if(!f.cls){box.innerHTML='<div class="empty">استورد ملف JSON للبدء.</div>';return}var rows=studentList(f);if(!rows.length){box.innerHTML='<div class="empty">لا يوجد طلاب في الاختيار الحالي.</div>';return}var ls=f.unit?lessonsFor(f.cls,f.unit):allLessonsForClass(f.cls);box.innerHTML=rows.map(function(p){var done=ls.length>0&&ls.every(function(l){return scoreFor(f,p,l)!==undefined&&scoreFor(f,p,l)!==null&&String(scoreFor(f,p,l))!=='';});if(!f.unit){return '<article class="student compact-student '+(done?'progress-done':'progress-pending')+'" data-name="'+esc(p.name)+'" data-sec="'+esc(p.section)+'"><div class="student-head"><span class="compact-status '+(done?'done':'pending')+'">'+(done?'✓':'!')+'</span><div class="student-name">'+esc(p.name)+'</div></div></article>';}if(!f.lesson){return '<article class="student '+(done?'progress-done':'progress-pending')+'" data-name="'+esc(p.name)+'" data-sec="'+esc(p.section)+'"><div class="student-head"><div><div class="student-name">'+esc(p.name)+'</div></div><span class="progress-status '+(done?'done':'pending')+'">'+(done?'✓ مكتمل':'غير مكتمل')+'</span></div></article>';}var n=violationCount(f.cls,p);return '<article class="student '+(n?'has-v':'')+'" data-name="'+esc(p.name)+'" data-sec="'+esc(p.section)+'"><div class="student-head"><div><div class="student-name">'+esc(p.name)+'</div></div><span class="vcount">'+n+' مخالفة</span></div>'+scoreButtons(f,p,f.lesson)+'</article>';}).join('');}
function addQueueCheck(x){var k=qkey(x),old=queue.checks.find(function(y){return qkey(y)===k});if(old){if(x.clear||x.score===null){old.clear=true;old.score=null;}else if(num(x.score)>=num(old.score)){old.clear=false;old.score=num(x.score);}old.updatedAt=new Date().toISOString();}else queue.checks.push(Object.assign({},x,{id:'local_'+Date.now()+'_'+Math.random().toString(16).slice(2),updatedAt:new Date().toISOString()}));}
function setScore(f,p,lesson,value){var d=ensureClass(f.cls),k=ckey(p.name,p.section),m=d.checks[k]||(d.checks[k]={}),old=m[lesson],same=old!==undefined&&Number(old)===Number(value);if(same){delete m[lesson];addQueueCheck({className:f.cls,name:p.name,section:p.section,lesson:lesson,score:null,clear:true});setState('تم إلغاء التقييم وحفظه كغير مقيم');}else{m[lesson]=Number(value);addQueueCheck({className:f.cls,name:p.name,section:p.section,lesson:lesson,score:Number(value),clear:false});setState('تم الحفظ محليًا — يمكنك التصدير أو متابعة العمل');}save();renderCards();}
function violationSame(a,b){return String(a.name||'').trim()===String(b.name||'').trim()&&String(a.section||'').trim()===String(b.section||'').trim()&&String(a.date||'').trim()===String(b.date||'').trim()&&String(a.type||'').trim()===String(b.type||'').trim();}
function deleteViolation(p,f,x){var d=ensureClass(f.cls),arr=d.violations||[],pending=queue.violations.some(function(y){return y.className===f.cls&&violationSame(y,x);});d.violations=arr.filter(function(y){return !violationSame(y,x);});queue.violations=queue.violations.filter(function(y){return !(y.className===f.cls&&violationSame(y,x));});if(!pending){var already=queue.violationDeletes.some(function(y){return y.className===f.cls&&violationSame(y,x);});if(!already)queue.violationDeletes.push(Object.assign({},x,{className:f.cls,id:'local_'+Date.now()+'_'+Math.random().toString(16).slice(2)}));}save();openViolationHistoryOnly(p,f);renderCards();setState('تم حذف المخالفة وحفظ طلب الحذف محليًا');}
function openViolationHistoryOnly(p,f){var d=ensureClass(f.cls),all=(d.violations||[]).filter(function(x){return x.name===p.name&&x.section===p.section;}).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});var body=all.length?'<table class="history-table"><thead><tr><th>التاريخ</th><th>المخالفة</th><th>إجراء</th></tr></thead><tbody>'+all.map(function(x,i){return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.type)+'</td><td><button type="button" class="btn red delete-history" data-history-index="'+i+'" style="min-height:26px;padding:2px 8px;font-size:11px">حذف</button></td></tr>';}).join('')+'</tbody></table>':'<div class="unit-note">لا توجد مخالفات مسجلة لهذا الطالب.</div>';$('modal').innerHTML='<div class="modal-head"><h2>⚠️ مخالفات: '+esc(p.name)+'</h2><button class="close" id="closeModal">×</button></div>'+body;$('modalOverlay').classList.add('open');$('closeModal').onclick=closeModal;$('modal').querySelectorAll('.delete-history').forEach(function(b){b.onclick=function(){var i=Number(b.getAttribute('data-history-index'));if(all[i]&&confirm('حذف هذه المخالفة؟'))deleteViolation(p,f,all[i]);};});}
