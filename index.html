/* ===== درجات ملخص البوابة الموزونة: نسخة طبق الأصل من حساب البوابة ===== */
/* حساب الدرجة الموزونة — نسخة طبق الأصل من منطق البوابة (code.gs + buildUnifiedStudentGradeSummary) */
function computePortalWeighted(XLSX,wb){
  var names=wb.SheetNames;
  function cell(v){return String(v==null?'':v);}
  function trim(v){return cell(v).trim();}
  function cleanNorm(v){return cell(v).replace(/[ـ]/g,'').replace(/\s+/g,' ').trim();}
  function normSec(v){var s=trim(v).replace(/[،,]/g,'.');if(/^\d+(?:\.0+)?$/.test(s))return String(Number(s));return s;}
  function rosterKey(v){var raw=trim(v);if(/^[-+]?\d+(?:\.0+)?$/.test(raw))return String(Number(raw));return cleanNorm(raw).toLowerCase();}
  function canon(v){var s=trim(v).replace(/^'+/,'').replace(/\s/g,'');var m=s.match(/^(\d{1,2})[-\/]\s*(\d{1,2})(?:[-\/]\d{2,4})?$/);if(m)return Number(m[1])+'-'+Number(m[2]);return s;}
  function checkLesson(v){var id=canon(v);return /^\d{1,2}-\d{1,2}$/.test(String(id||''))?id:'';}
  function rows(n){var ws=n&&wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{header:1,defval:''}):[];}
  function sheetByName(n){var w=cleanNorm(n);for(var i=0;i<names.length;i++)if(cleanNorm(names[i])===w)return names[i];return null;}
  function digits(raw){return raw.replace(/[٠-٩]/g,function(c){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(c));}).replace(/[۰-۹]/g,function(c){return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c));});}
  // homeworkEffectiveScore_
  function hwScore(value){var raw=trim(value);if(!raw)return '';raw=digits(raw).replace(/[٫،,]/g,'.').replace(/[٬\s]/g,'');var n=Number(raw);return isFinite(n)?(function(v){v=Math.min(10,Math.max(0,v));return Math.round(v*10+1e-9)/10;})(n):0;}
  // activityScoreValue_
  function actScore(value){var text=cell(value).trim().replace(/[،,]/g,'.');if(text==='')return '';var n=Number(text);return isNaN(n)?'':n;}
  // summaryNumber (من واجهة البوابة)
  function summaryNumber(v){var t=cell(v).trim().replace(/[،,]/g,'.');if(t==='')return NaN;var n=Number(t);return isNaN(n)?parseFloat(t):n;}
  function parseAch(value){var raw=trim(value);if(!raw)return {url:'',score:''};try{var o=JSON.parse(raw);return {url:String(o.url||''),score:o.score==null?'':String(o.score)};}catch(e){return {url:raw,score:''};}}
  function isTestTarget(v){var x=trim(v).toLowerCase();return x==='test'||x==='اختبار'||x==='الاختبار'||x==='exam'||x==='true';}

  var settings=rows('إعدادات_الواجبات').slice(1);
  var metaRows=rows('إعدادات الإنجازات').slice(1).map(function(r){return r.map(cell);});
  var totalsRows=rows('درجات إنجازات الوحدات').slice(1).map(function(r){return r.map(cell);});
  var phrases={};rows('عبارات_التقييم').slice(1).forEach(function(r){var k=cell(r[0]);if(!k)return;phrases[k]={outstanding:cell(r[1]),excellent:cell(r[2]),good:cell(r[3]),weak:cell(r[4]),zero:cell(r[5])};});

  var classes=[];settings.forEach(function(r){var c=cleanNorm(r[0]);if(c&&classes.indexOf(c)<0)classes.push(c);});
  var out={classes:{},phrases:phrases,count:0};

  classes.forEach(function(cls){
    var gradeName=sheetByName(cls);if(!gradeName)return;
    var g=rows(gradeName);if(g.length<2)return;
    var gh=g[0].map(trim);
    // الواجبات المنشورة بترتيب الورقة (بدون حذف التكرار كما في البوابة)
    var published=[];settings.forEach(function(r){if(cleanNorm(r[0])===cls&&trim(r[3])==='منشور')published.push(canon(r[1]));});
    if(!published.length)return;

    // ورقة الأنشطة (long format)
    var actName=sheetByName('تسليم أنشطة '+cls),actMap={};
    if(actName){rows(actName).slice(1).forEach(function(r){var nm=trim(r[0]);if(!nm)return;var id=Number(r[2])+'-'+Number(r[3]),k=nm+'|'+normSec(r[1])+'|'+Number(r[2])+'|'+Number(r[3]);actMap[k]={name:nm,id:id,score:actScore(r[5])};});}
    function actFind(name,section,id){var p=id.split('-'),k=trim(name)+'|'+normSec(section)+'|'+Number(p[0])+'|'+Number(p[1]);if(actMap[k])return actMap[k];var target=trim(name),found=null;Object.keys(actMap).some(function(kk){var v=actMap[kk];if(v.name===target&&v.id===canon(id)){found=v;return true;}return false;});return found;}

    // ورقة تحقق
    var chkName=sheetByName('تحقق '+cls),chkHeaders=[],chkRows=[];
    if(chkName){var ca=rows(chkName);if(ca.length){var valid=[];ca[0].slice(2).forEach(function(h,j){var id=checkLesson(h);if(id)valid.push({id:id,col:j+2});});chkHeaders=valid.map(function(x){return x.id;});chkRows=ca.slice(1).map(function(r){return [cell(r[0]),cell(r[1])].concat(valid.map(function(x){return cell(r[x.col]);}));});}}
    function checkGrades(section,name){var o={},idx=-1;for(var i=0;i<chkRows.length;i++)if(normSec(chkRows[i][0])===normSec(section)&&trim(chkRows[i][1])===trim(name)){idx=i;break;}if(idx<0)return o;chkHeaders.forEach(function(h,j){if(h&&trim(chkRows[idx][j+2])!=='')o[h]=chkRows[idx][j+2];});return o;}

    // الاختبارات
    var testName=sheetByName('اختبارات '+cls),testMap={};
    if(testName){var ta=rows(testName);if(ta.length>1){var th=ta[0].map(cell);ta.slice(1).forEach(function(r){var nm=trim(r[0]),sec=trim(r[1]);if(!nm)return;var key=nm+'|'+sec,nk=rosterKey(nm)+'|'+rosterKey(sec),entry=testMap[key]||(testMap[key]=testMap[nk]||{});testMap[nk]=entry;for(var i=2;i<th.length;i++){var m=th[i].match(/^اختبار(\d+)$/);if(!m)continue;var v=trim(r[i]);if(v!=='')entry[String(Number(m[1]))]=v;}});}}

    // الإنجازات
    var achName=sheetByName('إنجازات '+cls),achHeaders=[],achRows=[];
    if(achName){var aa=rows(achName);if(aa.length){achHeaders=aa[0].map(cell);achRows=aa.slice(1).map(function(r){var o=[];for(var i=0;i<achHeaders.length;i++)o.push(cell(r[i]));return o;});}}
    function metaOf(name){for(var i=0;i<metaRows.length;i++){var r=metaRows[i];if(cleanNorm(r[0])===cls&&trim(r[1])===trim(name)){var t=isTestTarget(r[5])?'test':'achievement';return {unit:(trim(r[2])===''&&t==='achievement')?'1':cell(r[2]),target:t};}}return {unit:'',target:'achievement'};}
    function unitKey(c,name,sec,u){return cleanNorm(c)+'|'+trim(name)+'|'+normSec(sec)+'|'+String(Number(u));}
    var overrides={};totalsRows.forEach(function(r){var s=trim(r[4]);if(s!==''&&isFinite(Number(s)))overrides[unitKey(r[0],r[1],r[2],r[3])]=Number(s);});
    function achDefs(unit){var o=[];metaRows.forEach(function(r){if(cleanNorm(r[0])===cls&&(trim(r[2])===''?'1':String(Number(r[2])))===String(Number(unit))&&!isTestTarget(r[5])&&trim(r[1]))o.push(trim(r[1]));});return o;}
    function mergedAch(name,section){var cands=achRows.filter(function(r){return trim(r[0])===trim(name)&&cleanNorm(r[1])===cls;}),sec=normSec(section),ordered=cands.filter(function(r){return normSec(r[2])===sec;}).concat(cands.filter(function(r){return normSec(r[2])!==sec;})),merged=[];for(var j=3;j<achHeaders.length;j++){var v='';for(var k=0;k<ordered.length;k++){var c=parseAch(ordered[k][j]);if(c.url||c.score!==''){v=ordered[k][j];break;}}merged[j]=v;}return merged;}
    function rawUnitTotal(name,section,unit){var merged=mergedAch(name,section),total=0;achDefs(unit).forEach(function(n){var ci=achHeaders.map(trim).indexOf(n);if(ci>=3)total+=Number(parseAch(merged[ci]).score)||0;});return Math.min(10,total);}
    function approvedUnit(name,section,unit){var key=unitKey(cls,name,section,unit);if(Object.prototype.hasOwnProperty.call(overrides,key)){var ov=Math.min(10,Math.max(0,Number(overrides[key])||0));if(ov>0)return ov;var rv=rawUnitTotal(name,section,unit);return rv>0?rv:0;}return rawUnitTotal(name,section,unit);}
    // getStudentAchievements_raw_
    function studentAch(name,section){var wanted=trim(name),sec=trim(section),cand=[];for(var i=0;i<achRows.length;i++)if(trim(achRows[i][0])===wanted&&cleanNorm(achRows[i][1])===cls){if(trim(achRows[i][2])===sec)cand.unshift(i);else cand.push(i);}
      var o=[];achHeaders.slice(3).forEach(function(n,j){var chosen={url:'',score:''};for(var k=0;k<cand.length;k++){var c=parseAch(achRows[cand[k]][j+3]);if(c.url||c.score!==''){chosen=c;break;}}var meta=metaOf(trim(n));if(trim(n))o.push({name:trim(n),score:chosen.score,unit:meta.unit,target:meta.target});});return o;}
    function unitTotals(name,section){var units={},raw=studentAch(name,section);raw.forEach(function(x){if(x.target==='test')return;var r=trim(x.score);if(r===''||!isFinite(Number(r)))return;var u=trim(x.unit);units[u===''?'1':String(Number(u))]=true;});var prefix=cls+'|'+trim(name)+'|'+normSec(section)+'|';Object.keys(overrides).forEach(function(k){if(k.indexOf(prefix)!==0)return;var u=k.slice(prefix.length);if(/^\d+$/.test(u))units[String(Number(u))]=true;});return Object.keys(units).sort(function(a,b){return Number(a)-Number(b);}).map(function(u){return {unit:u,score:approvedUnit(name,section,u)};});}
    // الوحدات المقيّمة على مستوى الصف كله
    var activeUnits=(function(){var units={};Object.keys(testMap).forEach(function(sk){var row=testMap[sk]||{};Object.keys(row).forEach(function(u){if(trim(row[u])!=='')units[String(Number(u))]=true;});});
      var byName={};metaRows.forEach(function(r){if(cleanNorm(r[0])!==cls)return;var n=trim(r[1]),u=trim(r[2])===''?'1':String(Number(r[2]));if(n)byName[n]={unit:u,target:isTestTarget(r[5])?'test':'achievement'};});
      achRows.forEach(function(row){for(var c=3;c<achHeaders.length;c++){var meta=byName[trim(achHeaders[c])];if(!meta||!meta.unit||meta.unit==='NaN')continue;var sc=parseAch(row[c]).score;if(trim(sc)!=='')units[meta.unit]=true;}});
      totalsRows.forEach(function(r){if(cleanNorm(r[0])!==cls||trim(r[4])==='')return;var u=String(Number(r[3]));if(u!=='NaN')units[u]=true;});
      return Object.keys(units).filter(function(u){return u!=='NaN'&&Number(u)>0;}).sort(function(a,b){return Number(a)-Number(b);});})();
    // getStudentGradeUnitRows
    function unitRowsFor(name,section){var tests=testMap[trim(name)+'|'+trim(section)]||{},ach=studentAch(name,section),project={};ach.forEach(function(x){if(x.target!=='test')return;var u=String(Number(x.unit||0)),raw=trim(x.score);if(!u||u==='NaN'||raw==='')return;project[u]=(project[u]||0)+(Number(raw.replace(/[،,]/g,'.'))||0);});
      return activeUnits.map(function(u){var rt=trim(tests[u]==null?'':tests[u]),tn=Number(rt.replace(/[،,]/g,'.'));if(!isFinite(tn))tn=0;var pr=project[u]||0;return {unit:u,test:Math.min(20,Math.max(0,tn+pr))};});}

    var list=[];
    g.slice(1).forEach(function(r){
      var nm=trim(r[1]),sec=trim(r[2]);if(!nm)return;
      var wanted=normSec(sec);
      // الواجبات المحلولة (أول قيمة لكل واجب من الصفوف المطابقة للاسم والفصل)
      var solved={};
      g.slice(1).forEach(function(rr){if(trim(rr[1])!==nm)return;if(wanted&&wanted!=='__ALL__'&&normSec(rr[2])!==wanted)return;gh.forEach(function(h,j){if(j<3)return;var value=trim(rr[j]),id=canon(h);if(value!==''&&!Object.prototype.hasOwnProperty.call(solved,id))solved[id]=hwScore(rr[j]);});});
      var checks=checkGrades(sec,nm);
      var items=published.map(function(id){var isSolved=Object.prototype.hasOwnProperty.call(solved,id),x=actFind(nm,sec,id)||{},sc=actScore(x.score);return {id:id,isSolved:isSolved,score:isSolved?solved[id]:null,activityScore:sc,checkScore:checks[id]||null};});
      // buildUnifiedStudentGradeSummary
      var total=items.length,hs=0,as=0,cs=0;
      items.forEach(function(a){var hv=summaryNumber(a.isSolved?a.score:0);if(!isNaN(hv))hs+=hv;var av=summaryNumber(a.activityScore);if(!isNaN(av)&&av>0)as+=av;var cv=summaryNumber(a.checkScore);if(!isNaN(cv))cs+=cv;});
      var ut=unitTotals(nm,sec),e=0;
      if(ut.length)e=ut.reduce(function(t,x){return t+(Number(x.score)||0);},0);
      else studentAch(nm,sec).forEach(function(x){var n=summaryNumber(x.score);if(!isNaN(n)&&x.target!=='test')e+=n;});
      var ur=unitRowsFor(nm,sec),tt=0;ur.forEach(function(x){tt+=Number(x.test)||0;});var testScore=ur.length?tt/ur.length:0;
      var h=total?Math.min(10,hs/total):0,a=total?Math.min(10,as/total):0,c=total?Math.min(10,cs/total):0,ach=Math.min(10,e),test=Math.min(20,summaryNumber(testScore)||0),sum=Math.min(60,Math.ceil(h+a+c+ach+test));
      list.push({name:nm,section:sec,homework:h,activity:a,check:c,achievement:ach,test:test,total:sum});
    });
    out.classes[cls]=list;out.count+=list.length;
  });
  return out;
}

function portalKey(name,section){return normName(name)+'|'+String(section==null?'':section).trim();}
function portalDetailFor(cls,p){var d=state.classes[cls]||{},m=d.portalDetails||{},k=portalKey(p.name,p.section);if(Object.prototype.hasOwnProperty.call(m,k))return m[k];k=normName(p.name);return Object.prototype.hasOwnProperty.call(m,k)?m[k]:undefined;}
function portalScoreFor(cls,p){var det=portalDetailFor(cls,p);if(det)return det.total;var d=state.classes[cls]||{},m=d.portalScores||{},k=normName(p.name);return Object.prototype.hasOwnProperty.call(m,k)?m[k]:undefined;}
function portalScoreLabel(cls,p){var v=portalScoreFor(cls,p);return v===undefined?'':String(v)+'/60';}

function portalWeightedTable(det){var rows={homework:{score:det.homework},activity:{score:det.activity},check:{score:det.check},achievement:{score:det.achievement},test:{score:det.test},total:{score:det.total}},phrases=state.portalPhrases||{};var order=[['homework','الواجبات',10,'#2563eb'],['activity','الأنشطة',10,'#7c3aed'],['check','تحقق الفهم',10,'#0891b2'],['achievement','الإنجازات',10,'#d97706'],['test','الاختبار',20,'#db2777'],['total','المجموع',60,'']],full=Math.round(Number((rows.total||{}).score||0))>=60,h='<div class="weighted-score-card'+(full?' full-score-card':'')+'"><table class="weighted-score-table"><thead><tr><th colspan="3">الدرجات الموزونة</th></tr><tr><th>القسم</th><th>الدرجة</th><th>ملاحظات</th></tr></thead><tbody>';order.forEach(function(x){var r=rows[x[0]]||{},n=Math.min(x[2],Math.max(0,Number(r.score)||0)),ph=phrases[x[0]],max=x[2],pct=max?n/max*100:0,level=pct<=0?'zero':pct>=100?'outstanding':pct>=75?'excellent':pct>=50?'good':'weak',rowClass=x[0]==='total'?' weighted-total-'+level:'';h+='<tr class="'+rowClass.trim()+'"><td'+(x[0]==='total'?'':' style="color:'+x[3]+';font-weight:900"')+'>'+x[1]+'</td><td><b>'+Math.round(n*100)/100+' / '+x[2]+'</b></td><td>'+esc(ph&&ph[level]?ph[level]:portalEvalText(n,x[0]))+'</td></tr>';});return h+'</tbody></table></div>';}
function openPortalScoreModal(p,cls){var det=portalDetailFor(cls,p),body=det?portalWeightedTable(det):'<div class="unit-note">لا توجد تفاصيل محفوظة لهذه الدرجة. أعد استيراد ملف Excel من البوابة لعرض جدول الدرجات الموزونة.</div>';$('modal').innerHTML='<div class="modal-head"><h2>📊 '+esc(p.name)+'</h2><button class="close" id="closeModal">×</button></div><div style="margin-top:10px">'+body+'</div>';$('modalOverlay').classList.add('open');lockViolationBackground_();$('closeModal').onclick=closeModal;}
function mergePortalExcel(file){
  if(!window.XLSX)throw Error('تعذر تحميل قارئ Excel.');
  return file.arrayBuffer().then(function(buf){
    var wb=XLSX.read(buf,{type:'array'}),res=computePortalWeighted(XLSX,wb),count=0;
    Object.keys(res.classes).forEach(function(cls){var d=ensureClass(cls);d.portalScores=d.portalScores||{};d.portalDetails=d.portalDetails||{};res.classes[cls].forEach(function(r){var det={homework:r.homework,activity:r.activity,check:r.check,achievement:r.achievement,test:r.test,total:r.total};d.portalScores[normName(r.name)]=r.total;d.portalDetails[portalKey(r.name,r.section)]=det;d.portalDetails[normName(r.name)]=det;count++;});});
    if(!count)throw Error('لم أجد درجات قابلة للحساب. تأكد من تصدير Excel من البوابة واختيار الواجبات المنشورة.');
    state.portalPhrases=res.phrases;
    return save({silent:true}).then(function(){render();setState('تم حساب واستيراد '+count+' درجة من 60 بنفس طريقة البوابة.');alert('تم الاستيراد بنجاح\nتم حساب '+count+' درجة من 60 بنفس طريقة ملخص الدرجات في البوابة.');});
  });
